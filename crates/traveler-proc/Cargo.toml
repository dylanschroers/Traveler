[package]
name = "traveler-proc"
edition.workspace = true
version.workspace = true

[dependencies]
traveler-core = { path = "../traveler-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]

[lib]
name = "traveler_proc"
path = "src/lib.rs"

[[bin]]
name = "traveler-proc"
path = "src/main.rs"

# The target the capture tests measure: a known set of mappings with known permissions, so a
# plausible-looking city that is quietly wrong fails a test instead of passing review.
[[bin]]
name = "traveler-fixture"
path = "src/bin/fixture.rs"
