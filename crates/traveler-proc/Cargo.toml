[package]
name = "traveler-proc"
edition.workspace = true
version.workspace = true

[dependencies]
traveler-core = { path = "../traveler-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lib]
name = "traveler_proc"
path = "src/lib.rs"

[[bin]]
name = "traveler-proc"
path = "src/main.rs"

# The target the capture tests measure: a known set of mappings with known permissions, so a
# plausible-looking city that is quietly wrong fails a test instead of passing review.
[[bin]]
name = "traveler-fixture"
path = "src/bin/fixture.rs"
